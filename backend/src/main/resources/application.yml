server:
  port: ${SPRING_SERVER_PORT:8080}

spring:
  application:
    name: chatbot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:h2:${H2_MODE:file}:${H2_DATABASE_PATH:./data/clinconnect-poc}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    hibernate:
      # No Flyway module ships with this Spring Boot version (verified against
      # the resolved dependency tree: no spring-boot-flyway artifact exists
      # alongside spring-boot-jdbc/-jpa/etc). For the POC, Hibernate recreates
      # the schema from the JPA entities on every startup and
      # SyntheticDataSeeder repopulates it — deterministic either way
      # (docs/11-LOCAL-DEVELOPMENT.md: "in-memory H2 is acceptable if startup
      # fixtures recreate data deterministically").
      ddl-auto: create

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

clinconnect:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  config:
    intents-path: ${CLINCONNECT_INTENTS_CONFIG_PATH:../config/intents.yaml}
    tools-path: ${CLINCONNECT_TOOLS_CONFIG_PATH:../config/tools.yaml}
  dev-auth:
    enabled: ${LOCAL_AUTH_ENABLED:true}
    default-user: ${LOCAL_AUTH_DEFAULT_USER:local-user-1}
    default-role: ${LOCAL_AUTH_DEFAULT_ROLE:CHATBOT_USER}
  time:
    tonight-start-local: ${TONIGHT_START_LOCAL:17:00}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:20}
    # Phase 7 POC hardening: a single bounded retry, after this delay, on a transport-level
    # ai-service failure (connection refused/reset, timeout) only — not on a well-formed
    # error response ai-service itself returns. See PythonInterpretationClient Javadoc.
    retry-delay-millis: ${AI_SERVICE_RETRY_DELAY_MILLIS:300}
  session:
    ttl-seconds: ${SESSION_TTL_SECONDS:1800}
    max-processed-messages: ${MAX_PROCESSED_MESSAGES_PER_SESSION:20}
  seed:
    # Directory of hand-editable seed-data CSVs (SyntheticDataSeeder) — one file per
    # entity, loaded fresh on every startup. See config/seed-data/README.md.
    data-dir: ${CLINCONNECT_SEED_DATA_DIR:../config/seed-data}
    # Wall-clock-relative "who is on call" coverage_assignment rows for a live/manual
    # session only (SyntheticDataSeeder). Left false by default so `mvn test` — which
    # does not source .env — never seeds these and collides with deterministic test
    # fixtures; .env/.env.example turn it on for local manual runs.
    live-demo-coverage: ${SEED_LIVE_DEMO_COVERAGE:false}
